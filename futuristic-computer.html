<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic 3D Workstation Experience</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Orbitron:wght@400;600;800;900&family=Outfit:wght@300;400;600;800&display=swap"
        rel="stylesheet">

    <!-- External Libraries via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <!-- AI MediaPipe Hands & Camera Utils for Touchless Air Hand Gesture Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --primary: #00f0ff;
            --secondary: #ff007f;
            --accent: #7000ff;
            --bg-dark: #030408;
            --glass-bg: rgba(8, 14, 28, 0.82);
            --glass-border: rgba(0, 240, 255, 0.35);
            --text-main: #e2f1ff;
            --font-main: 'Outfit', sans-serif;
            --font-tech: 'Orbitron', sans-serif;
            --font-code: 'Fira Code', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: var(--font-main);
            color: var(--text-main);
        }

        /* Canvas Container */
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 2D Offscreen Canvas for Screen Texture rendering (hidden) */
        #screen-canvas {
            display: none;
        }

        /* Overlay Cyber Grid & Vignette */
        .overlay-vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            background:
                radial-gradient(circle at center, transparent 45%, rgba(2, 3, 8, 0.88) 100%),
                linear-gradient(rgba(0, 240, 255, 0.015) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 100%, 100% 4px;
        }

        /* Start / Boot Screen Overlay */
        #boot-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background: radial-gradient(circle at center, #0c1222 0%, #020307 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1.2s cubic-bezier(0.19, 1, 0.22, 1), visibility 1.2s;
        }

        #boot-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .boot-card {
            background: rgba(12, 22, 42, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 24px;
            padding: 50px 65px;
            text-align: center;
            backdrop-filter: blur(24px);
            box-shadow: 0 0 60px rgba(0, 240, 255, 0.2), inset 0 0 35px rgba(0, 240, 255, 0.08);
            max-width: 580px;
            width: 90%;
            position: relative;
            overflow: hidden;
        }

        .boot-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(0, 240, 255, 0.12), transparent);
            transform: rotate(45deg);
            animation: bootGlow 4s infinite linear;
        }

        @keyframes bootGlow {
            0% {
                transform: translateY(-100%) rotate(45deg);
            }

            100% {
                transform: translateY(100%) rotate(45deg);
            }
        }

        .logo-title {
            font-family: var(--font-tech);
            font-size: 2.6rem;
            font-weight: 900;
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 0 0 25px var(--primary);
            margin-bottom: 8px;
        }

        .logo-sub {
            font-size: 0.9rem;
            color: var(--primary);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 35px;
            font-weight: 600;
        }

        .boot-btn {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.25), rgba(112, 0, 255, 0.45));
            border: 1px solid var(--primary);
            color: #fff;
            padding: 18px 45px;
            font-family: var(--font-tech);
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 3px;
            border-radius: 30px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.35);
        }

        .boot-btn:hover {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.7), rgba(255, 0, 127, 0.7));
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.7), 0 0 90px rgba(255, 0, 127, 0.5);
            transform: translateY(-2px) scale(1.03);
        }

        /* Top Cyber Header UI */
        .cyber-header {
            position: absolute;
            top: 25px;
            left: 30px;
            right: 30px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease 1s;
        }

        .cyber-header.active {
            opacity: 1;
            pointer-events: auto;
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .sys-badge {
            background: rgba(0, 240, 255, 0.12);
            border: 1px solid var(--primary);
            padding: 6px 14px;
            border-radius: 8px;
            font-family: var(--font-tech);
            font-size: 0.8rem;
            color: var(--primary);
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
        }

        .header-clock {
            font-family: var(--font-code);
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 1px;
        }

        /* VERTICAL SIDE FLOATING INTERACTIVE CONTROL PANEL (LEFT SIDE) */
        .cyber-dock {
            position: absolute;
            left: 25px;
            top: 52%;
            transform: translateY(-50%);
            z-index: 10;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
            backdrop-filter: blur(18px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 240, 255, 0.2);
            opacity: 0;
            width: 170px;
            transition: opacity 1s ease 1.2s, transform 0.3s ease;
        }

        .cyber-dock.active {
            opacity: 1;
        }

        .dock-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            padding: 11px 14px;
            border-radius: 14px;
            font-size: 0.78rem;
            font-family: var(--font-tech);
            letter-spacing: 1.2px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            justify-content: flex-start;
            position: relative;
            overflow: hidden;
        }

        .dock-btn:hover,
        .dock-btn.hover-active {
            background: rgba(0, 240, 255, 0.3);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            transform: translateX(4px);
        }

        .dock-btn.active-preset {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-color: #fff;
            box-shadow: 0 0 25px var(--primary);
        }

        .dock-separator {
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 2px 0;
        }

        /* Component Hover Info Tooltip */
        #info-tooltip {
            position: absolute;
            z-index: 20;
            pointer-events: none;
            background: rgba(6, 12, 24, 0.92);
            border: 1px solid var(--primary);
            border-radius: 12px;
            padding: 12px 18px;
            backdrop-filter: blur(14px);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.35);
            opacity: 0;
            transform: translate(-50%, -120%) scale(0.9);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        #info-tooltip.visible {
            opacity: 1;
            transform: translate(-50%, -120%) scale(1);
        }

        .tooltip-title {
            font-family: var(--font-tech);
            font-size: 0.9rem;
            color: var(--primary);
            letter-spacing: 1.5px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .tooltip-desc {
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.88);
            font-weight: 400;
        }

        /* AI WEBCAM HAND TRACKING OVERLAY UI */
        #webcam-container {
            position: absolute;
            top: 25px;
            right: 30px;
            width: 210px;
            height: 155px;
            background: rgba(4, 8, 18, 0.85);
            border: 1px solid var(--primary);
            border-radius: 16px;
            overflow: hidden;
            z-index: 25;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(12px);
        }

        #webcam-video {
            display: none;
        }

        #webcam-canvas {
            width: 100%;
            height: 125px;
            object-fit: cover;
            transform: scaleX(-1);
            background: #000;
        }

        .webcam-status {
            font-family: var(--font-tech);
            font-size: 0.65rem;
            color: var(--primary);
            padding: 4px 8px;
            letter-spacing: 1px;
            text-align: center;
            width: 100%;
            background: rgba(0, 240, 255, 0.1);
        }

        /* Floating Cyber Hand Cursor with Radial Hover-Dwell Timer Ring */
        #hand-cursor {
            position: absolute;
            width: 34px;
            height: 34px;
            border: 2px solid var(--primary);
            border-radius: 50%;
            pointer-events: none;
            z-index: 30;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px var(--primary);
            display: block;
            transition: width 0.15s ease, height 0.15s ease, border-color 0.15s ease;
        }

        #hand-cursor::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* Radial Progress Ring for Auto Hover Click */
        #hand-progress-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 48px;
            height: 48px;
            border: 3px solid transparent;
            border-top-color: var(--secondary);
            border-right-color: var(--secondary);
            border-radius: 50%;
            transform: translate(-50%, -50%) rotate(0deg);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        #hand-progress-ring.active {
            opacity: 1;
            animation: ringSpin 0.7s linear forwards;
        }

        @keyframes ringSpin {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        #hand-cursor.pinched {
            width: 18px;
            height: 18px;
            border-color: var(--secondary);
            background: rgba(255, 0, 127, 0.3);
            box-shadow: 0 0 25px var(--secondary);
        }

        /* Responsive UI Adjustments */
        @media (max-width: 768px) {
            .cyber-dock {
                top: auto;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                width: 92%;
                flex-direction: row;
                overflow-x: auto;
                padding: 10px 16px;
                border-radius: 20px;
            }

            .boot-card {
                padding: 35px 25px;
            }

            .logo-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>
    <!-- 3D WebGL Canvas -->
    <div id="webgl-container"></div>

    <!-- Hidden 2D Canvas for Rendering Dynamic 60FPS Screen UI -->
    <canvas id="screen-canvas" width="1024" height="640"></canvas>

    <!-- Overlay Scanline & Vignette Effect -->
    <div class="overlay-vignette"></div>

    <!-- Initial System Boot Overlay -->
    <div id="boot-overlay">
        <div class="boot-card">
            <div class="logo-title">NEXUS-9000</div>
            <div class="logo-sub">QUANTUM NEURAL WORKSTATION</div>
            <button class="boot-btn" id="start-btn">INITIALIZE SYSTEM</button>
        </div>
    </div>

    <!-- Cyber Header Bar -->
    <div class="cyber-header" id="cyber-header">
        <div class="header-title-box">
            <a href="index.html" class="sys-badge"
                style="text-decoration: none; display: inline-flex; align-items: center; gap: 4px; background: rgba(0, 240, 255, 0.25); color: #fff; cursor: pointer;">←
                BACK TO HUB</a>
            <div class="sys-badge">SYS: ONLINE</div>
            <div class="sys-badge" id="temp-badge" style="border-color: var(--secondary); color: var(--secondary);">CORE
                TEMP: 34°C</div>
        </div>
        <div class="header-clock" id="live-clock">00:00:00 UTC</div>
    </div>

    <!-- AI Webcam Hand Tracking HUD Feed Overlay -->
    <div id="webcam-container">
        <video id="webcam-video" playsinline></video>
        <canvas id="webcam-canvas" width="320" height="240"></canvas>
        <div class="webcam-status" id="hand-status">AIR GESTURE: READY</div>
    </div>

    <!-- Floating Cybernetic Hand Pointer Cursor with Auto Hover Dwell Ring -->
    <div id="hand-cursor">
        <div id="hand-progress-ring"></div>
    </div>

    <!-- Component Tooltip Overlay -->
    <div id="info-tooltip">
        <div class="tooltip-title" id="tt-title">COMPONENT</div>
        <div class="tooltip-desc" id="tt-desc">Description text...</div>
    </div>

    <!-- Vertical Side Floating Interactive Control Dock (Left Side) -->
    <div class="cyber-dock" id="cyber-dock">
        <button class="dock-btn active-preset" data-view="overview">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
            </svg>
            CINEMATIC
        </button>
        <button class="dock-btn" data-view="screen">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="3" width="20" height="14" rx="2" />
                <line x1="8" y1="21" x2="16" y2="21" />
                <line x1="12" y1="17" x2="12" y2="21" />
            </svg>
            MONITOR
        </button>
        <button class="dock-btn" data-view="tower">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="4" y="2" width="16" height="20" rx="2" />
                <line x1="12" y1="6" x2="12.01" y2="6" />
                <line x1="12" y1="18" x2="12.01" y2="18" />
            </svg>
            CPU CORE
        </button>
        <button class="dock-btn" data-view="keyboard">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="6" width="20" height="12" rx="2" />
                <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8" />
            </svg>
            KEYBOARD
        </button>

        <div class="dock-separator"></div>

        <button class="dock-btn" id="theme-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 2a7 7 0 0 0 0 14 7 7 0 0 0 0-14z" />
            </svg>
            THEME
        </button>
        <button class="dock-btn" id="overclock-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
            </svg>
            OVERCLOCK
        </button>
        <button class="dock-btn" id="audio-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" />
            </svg>
            SFX
        </button>
    </div>

    <!-- JavaScript Master Script -->
    <script>
        /* ====================================================================
         * 1. GLOBAL STATE & THEMES CONFIGURATION
         * ==================================================================== */
        const STATE = {
            initialized: false,
            overclock: false,
            soundEnabled: true,
            themeIndex: 0,
            currentView: 'overview',
            hoveredObject: null,
            time: 0,
            handTrackingActive: true,
            isPinching: false,
            lastGestureTime: 0
        };

        const THEMES = [
            { name: "CYBERPUNK", primary: 0x00f0ff, secondary: 0xff007f, accent: 0x7000ff, primaryCss: "#00f0ff", secondaryCss: "#ff007f" },
            { name: "SOLARIS", primary: 0xffaa00, secondary: 0xff3300, accent: 0xffee00, primaryCss: "#ffaa00", secondaryCss: "#ff3300" },
            { name: "MATRIX", primary: 0x00ff66, secondary: 0x008844, accent: 0xccff00, primaryCss: "#00ff66", secondaryCss: "#008844" },
            { name: "NEBULA", primary: 0x9d00ff, secondary: 0x0066ff, accent: 0xff00cc, primaryCss: "#9d00ff", secondaryCss: "#0066ff" },
            { name: "ICE STEALTH", primary: 0x70d6ff, secondary: 0xffffff, accent: 0x0044ff, primaryCss: "#70d6ff", secondaryCss: "#ffffff" }
        ];

        function getActiveTheme() { return THEMES[STATE.themeIndex]; }

        /* ====================================================================
         * 2. SYNTHETIC WEB AUDIO SFX SYSTEM
         * ==================================================================== */
        class SoundSystem {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTone(freq, duration, type = 'sine', gainVal = 0.1) {
                if (!STATE.soundEnabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) { }
            }

            playPowerUp() {
                if (!STATE.soundEnabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 1.2);
                    gain.gain.setValueAtTime(0.01, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.15, this.ctx.currentTime + 0.6);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.4);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 1.4);
                } catch (e) { }
            }

            playClick() {
                this.playTone(1200, 0.08, 'sine', 0.05);
            }

            playHover() {
                this.playTone(600, 0.05, 'triangle', 0.03);
            }

            playOverclock() {
                this.playTone(300, 0.4, 'sawtooth', 0.12);
                setTimeout(() => this.playTone(900, 0.5, 'sine', 0.1), 150);
            }
        }
        const sfx = new SoundSystem();

        /* ====================================================================
         * 3. 2D MONITOR SCREEN CANVAS ANIMATION ENGINE (60 FPS)
         * ==================================================================== */
        const screenCanvas = document.getElementById('screen-canvas');
        const sCtx = screenCanvas.getContext('2d');

        function updateScreenCanvas(time) {
            const width = screenCanvas.width;
            const height = screenCanvas.height;
            const theme = getActiveTheme();

            // Background Fill
            sCtx.fillStyle = '#050914';
            sCtx.fillRect(0, 0, width, height);

            // Tech Grid
            sCtx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
            sCtx.lineWidth = 1;
            const gridSize = 32;
            for (let x = 0; x < width; x += gridSize) {
                sCtx.beginPath();
                sCtx.moveTo(x, 0);
                sCtx.lineTo(x, height);
                sCtx.stroke();
            }
            for (let y = 0; y < height; y += gridSize) {
                sCtx.beginPath();
                sCtx.moveTo(0, y);
                sCtx.lineTo(width, y);
                sCtx.stroke();
            }

            // Top Header Bar
            sCtx.fillStyle = 'rgba(0, 240, 255, 0.14)';
            sCtx.fillRect(20, 20, width - 40, 48);
            sCtx.strokeStyle = theme.primaryCss;
            sCtx.lineWidth = 1.5;
            sCtx.strokeRect(20, 20, width - 40, 48);

            sCtx.font = '700 16px "Orbitron", sans-serif';
            sCtx.fillStyle = '#ffffff';
            sCtx.fillText("NEXUS OS // QUANTUM WORKSTATION v9.4", 38, 50);

            const speedMultiplier = STATE.overclock ? 2.5 : 1.0;
            sCtx.fillStyle = STATE.overclock ? '#ff0055' : theme.primaryCss;
            sCtx.fillText(STATE.overclock ? "OVERCLOCK ACTIVE [4.2 GHz]" : "SYSTEM NOMINAL", width - 270, 50);

            // Left Panel: Audio Visualizer Spectrum Bars
            const visX = 30, visY = 90, visW = 310, visH = 220;
            sCtx.fillStyle = 'rgba(8, 15, 30, 0.85)';
            sCtx.fillRect(visX, visY, visW, visH);
            sCtx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            sCtx.strokeRect(visX, visY, visW, visH);

            sCtx.font = '600 12px "Orbitron", sans-serif';
            sCtx.fillStyle = theme.primaryCss;
            sCtx.fillText("NEURAL AUDIO SPECTRUM", visX + 15, visY + 25);

            const barCount = 20;
            const barW = (visW - 40) / barCount;

                const bx = visX + 20 + i * barW;
                const by = visY + visH - 20 - bh;

                const grad = sCtx.createLinearGradient(0, by, 0, by + bh);
                grad.addColorStop(0, theme.secondaryCss);
                grad.addColorStop(1, theme.primaryCss);

                sCtx.fillStyle = grad;
                sCtx.fillRect(bx, by, barW - 3, bh);

            sCtx.strokeStyle = theme.primaryCss;
            sCtx.lineWidth = 1.5;

            const ringCount = 9;
            for (let i = 0; i < ringCount; i++) {
                const angle = time * (0.8 + i * 0.12) * speedMultiplier;
                sCtx.beginPath();
                sCtx.ellipse(0, 0, radius, radius * Math.abs(Math.sin(angle)), angle, 0, Math.PI * 2);
                sCtx.stroke();
            }
            sCtx.restore();

            sCtx.font = '600 12px "Orbitron", sans-serif';
            sCtx.fillStyle = '#fff';
            sCtx.textAlign = 'center';

            sCtx.strokeRect(codeX, codeY, codeW, codeH);

            sCtx.font = '400 12px "Fira Code", monospace';

                `> NEXUS_KERNEL::INITIALIZE(CoreCount=32, ThreadCount=64)`,
                `> BUFFER_STREAM: OK [0x00FF892A] Latency: ${Math.floor((Math.sin(time * 5) + 1) * 2 + 1)}ms`,
                `> AIR_GESTURE_HOVER_SELECT: ACTIVE [TOUCHLESS AUTO-SELECTION]`,

                y: preset.target.y,

                ease: "power3.inOut",
                onUpdate: () => controls.update()
            });

            document.querySelectorAll('.dock-btn[data-view]').forEach(btn => {
                btn.classList.toggle('active-preset', btn.dataset.view === viewKey);
            });

            sfx.playClick();

        function cycleNextView() {
            const currIdx = viewOrder.indexOf(STATE.currentView);
            const nextIdx = (currIdx + 1) % viewOrder.length;
            setCameraView(viewOrder[nextIdx]);

            const currIdx = viewOrder.indexOf(STATE.currentView);
            const prevIdx = (currIdx - 1 + viewOrder.length) % viewOrder.length;

        window.addEventListener('mousemove', (e) => {
            if (!STATE.handTrackingActive) {
                mouseVec.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouseVec.y = -(e.clientY / window.innerHeight) * 2 + 1;

                if (tooltip.classList.contains('visible')) {
                    tooltip.style.left = `${e.clientX}px`;
                    tooltip.style.top = `${e.clientY}px`;
                }
            }
        });

        function checkRaycast() {
            raycaster.setFromCamera(mouseVec, camera);
            const intersects = raycaster.intersectObjects(interactiveGroup.children, true);

            if (intersects.length > 0) {
                let hitObj = intersects[0].object;
                while (hitObj && !hitObj.userData.name && hitObj.parent) {
                    hitObj = hitObj.parent;
                }

                if (hitObj && hitObj.userData && hitObj.userData.name) {
                    if (STATE.hoveredObject !== hitObj) {
                        STATE.hoveredObject = hitObj;
                        ttTitle.innerText = hitObj.userData.name;
                        ttDesc.innerText = hitObj.userData.desc;
                        tooltip.classList.add('visible');
                        document.body.style.cursor = 'pointer';
                        sfx.playHover();
                    }
                    return;
                }
            }

            if (STATE.hoveredObject) {
                STATE.hoveredObject = null;
                tooltip.classList.remove('visible');
                document.body.style.cursor = 'default';
            }
        }

        function triggerSceneClick() {
            if (STATE.hoveredObject) {
                const name = STATE.hoveredObject.userData.name;
                if (name === "MONITOR DISPLAY") setCameraView('screen');
                else if (name === "CPU TOWER CASE") setCameraView('tower');
                else if (name === "MECHANICAL KEYBOARD") setCameraView('keyboard');
            }

            if (e.target.closest('#cyber-dock') || e.target.closest('#boot-overlay') || e.target.closest('#webcam-container')) return;
            triggerSceneClick();

            holoConeMat.color.setHex(theme.primary);
            particleMat.color.setHex(theme.primary);

                const c = idx % 2 === 0 ? theme.primary : theme.secondary;
                k.light.material.color.setHex(c);
            });

            document.documentElement.style.setProperty('--primary', theme.primaryCss);
            document.documentElement.style.setProperty('--secondary', theme.secondaryCss);
        }

        function toggleTheme() {
            STATE.themeIndex = (STATE.themeIndex + 1) % THEMES.length;
            applyTheme(getActiveTheme());
            sfx.playClick();

            STATE.overclock = !STATE.overclock;

                tempBadge.style.borderColor = "var(--secondary)";
                tempBadge.style.color = "var(--secondary)";

            sfx.playOverclock();

            sfx.playClick();
        });

        document.querySelectorAll('.dock-btn[data-view]').forEach(btn => {
            btn.addEventListener('click', () => {
                setCameraView(btn.dataset.view);
            });
        });

        /* ====================================================================
         * 8. AUTOMATIC TOUCHLESS HOVER-DWELL SELECTION ENGINE
         * ==================================================================== */
        let activeHoverBtn = null;
        let hoverTimer = null;

        function updateHoverDwell(screenX, screenY) {
            const hitEl = document.elementFromPoint(screenX, screenY);
            const targetBtn = hitEl ? hitEl.closest('.dock-btn, .boot-btn, #start-btn') : null;

            if (targetBtn) {
                if (activeHoverBtn !== targetBtn) {
                    cancelHoverDwell();
                    activeHoverBtn = targetBtn;
                    targetBtn.classList.add('hover-active');
                    handProgressRing.classList.add('active');

                    hoverTimer = setTimeout(() => {
                        if (activeHoverBtn === targetBtn) {
                            targetBtn.click();
                            sfx.playClick();
                            cancelHoverDwell();
                        }
                    }, 650); // 650ms automatic dwell trigger
                }
            } else {
                if (activeHoverBtn) {
                    cancelHoverDwell();
                }
            }
        }

        function cancelHoverDwell() {
            if (hoverTimer) {
                clearTimeout(hoverTimer);
                hoverTimer = null;
            }
            if (activeHoverBtn) {
                activeHoverBtn.classList.remove('hover-active');
                activeHoverBtn = null;
            }
            handProgressRing.classList.remove('active');
        }

        /* ====================================================================
         * 9. AI WEBCAM TOUCHLESS AIR HAND GESTURE RECOGNITION (MEDIAPIPE)
         * ==================================================================== */
        const webcamVideo = document.getElementById('webcam-video');
        const webcamCanvas = document.getElementById('webcam-canvas');
        const wCtx = webcamCanvas.getContext('2d');
        const handStatus = document.getElementById('hand-status');
        let cameraUtilsInstance = null;

        let handsDetector = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        handsDetector.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        handsDetector.onResults(onHandResults);

        function drawHandSkeleton(landmarks) {
            wCtx.clearRect(0, 0, webcamCanvas.width, webcamCanvas.height);
            wCtx.drawImage(webcamVideo, 0, 0, webcamCanvas.width, webcamCanvas.height);

            if (!landmarks) return;

            const theme = getActiveTheme();
            wCtx.fillStyle = theme.primaryCss;
            wCtx.strokeStyle = theme.primaryCss;
            wCtx.lineWidth = 2;

            const connections = [
                [0, 1], [1, 2], [2, 3], [3, 4],
                [0, 5], [5, 6], [6, 7], [7, 8],
                [5, 9], [9, 10], [10, 11], [11, 12],
                [9, 13], [13, 14], [15, 16],
                [13, 17], [17, 18], [18, 19], [19, 20], [0, 17]
            ];

            connections.forEach(([i, j]) => {
                const pt1 = landmarks[i];
                const pt2 = landmarks[j];
                wCtx.beginPath();
                wCtx.moveTo(pt1.x * webcamCanvas.width, pt1.y * webcamCanvas.height);
                wCtx.lineTo(pt2.x * webcamCanvas.width, pt2.y * webcamCanvas.height);
                wCtx.stroke();
            });

            landmarks.forEach((pt, idx) => {
                wCtx.beginPath();
                wCtx.arc(pt.x * webcamCanvas.width, pt.y * webcamCanvas.height, (idx === 8 || idx === 12) ? 5 : 3, 0, Math.PI * 2);
                wCtx.fillStyle = (idx === 8 || idx === 12) ? theme.secondaryCss : theme.primaryCss;
                wCtx.fill();
            });
        }

        let lastHandX = 0.5;

        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                drawHandSkeleton(landmarks);

                // Index Finger Tip (Landmark 8) & Middle Finger Tip (Landmark 12)
                const indexPt = landmarks[8];
                const middlePt = landmarks[12];

                // Mirrored coordinates for intuitive screen movement
                const screenX = (1 - indexPt.x) * window.innerWidth;
                const screenY = indexPt.y * window.innerHeight;

                // Update 3D Raycast Vector
                mouseVec.x = ((1 - indexPt.x) * 2) - 1;
                mouseVec.y = -(indexPt.y * 2) + 1;

                // Move Cyber Hand Cursor
                handCursor.style.left = `${screenX}px`;
                handCursor.style.top = `${screenY}px`;

                if (tooltip.classList.contains('visible')) {
                    tooltip.style.left = `${screenX}px`;
                    tooltip.style.top = `${screenY}px`;
                }

                // Automatic Touchless Hover-Dwell Selection on Menu Buttons
                updateHoverDwell(screenX, screenY);

                // Two Finger Join Gesture (Index 8 + Middle 12) for Immediate Click
                const dx = middlePt.x - indexPt.x;
                const dy = middlePt.y - indexPt.y;
                const twoFingerDist = Math.sqrt(dx * dx + dy * dy);

                const now = Date.now();

                if (twoFingerDist < 0.045) {
                    if (!STATE.isPinching) {
                        STATE.isPinching = true;
                        handCursor.classList.add('pinched');
                        handStatus.innerText = "AIR GESTURE: INSTANT SELECT";
                        handStatus.style.color = "var(--secondary)";
                        sfx.playClick();

                        const hitElement = document.elementFromPoint(screenX, screenY);
                        if (hitElement && typeof hitElement.click === 'function' && (hitElement.classList.contains('dock-btn') || hitElement.id === 'start-btn')) {
                            hitElement.click();
                        } else {
                            triggerSceneClick();
                        }
                    }
                } else {
                    if (STATE.isPinching) {
                        STATE.isPinching = false;
                        handCursor.classList.remove('pinched');
                    }
                }

                // Air Swipe Recognition (Horizontal displacement speed)
                const xDiff = indexPt.x - lastHandX;
                if (now - STATE.lastGestureTime > 750) {
                    if (xDiff > 0.32) {
                        cycleNextView();
                        STATE.lastGestureTime = now;
                        handStatus.innerText = "GESTURE: SWIPE NEXT VIEW";
                    } else if (xDiff < -0.32) {
                        cyclePrevView();
                        STATE.lastGestureTime = now;
                        handStatus.innerText = "GESTURE: SWIPE PREV VIEW";
                    } else if (!STATE.isPinching) {
                        handStatus.innerText = "AIR GESTURE: TOUCHLESS ACTIVE";
                        handStatus.style.color = "var(--primary)";
                    }
                }
                lastHandX = indexPt.x;

            } else {
                drawHandSkeleton(null);
                cancelHoverDwell();
                handStatus.innerText = "AIR GESTURE: SEARCHING HAND...";
                handStatus.style.color = "#ffaa00";
            }
        }

        async function startHandTracking() {
            try {
                handStatus.innerText = "INITIALIZING WEBCAM...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                webcamVideo.srcObject = stream;
                await webcamVideo.play();

                cameraUtilsInstance = new Camera(webcamVideo, {
                    onFrame: async () => {
                        await handsDetector.send({ image: webcamVideo });
                    },
                    width: 320,
                    height: 240
                });
                cameraUtilsInstance.start();

                STATE.handTrackingActive = true;
                document.getElementById('webcam-container').style.display = 'flex';
                sfx.playPowerUp();

            } catch (err) {
                console.warn("Webcam access pending user approval or unavailable.");
            }
        }

        // Auto-start webcam tracking on page load so user never has to manually click
        window.addEventListener('load', () => {
            setTimeout(startHandTracking, 500);
        });

        /* ====================================================================
         * 10. SYSTEM INITIALIZATION & BOOT CINEMATIC SEQUENCE
         * ==================================================================== */
        document.getElementById('start-btn').addEventListener('click', () => {
            sfx.init();
            sfx.playPowerUp();

            const overlay = document.getElementById('boot-overlay');
            overlay.classList.add('hidden');

            document.getElementById('cyber-header').classList.add('active');
            document.getElementById('cyber-dock').classList.add('active');

            STATE.initialized = true;

            gsap.fromTo(camera.position,
                { x: 4.5, y: 1.2, z: 4.0 },
                { x: 0, y: 3.2, z: 7.8, duration: 3.0, ease: "power3.out", onUpdate: () => controls.update() }
            );
        });

        // Real-time Clock Update
        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toUTCString().split(' ')[4] + ' UTC';
        }
        setInterval(updateClock, 1000);
        updateClock();

        /* ====================================================================
         * 11. MAIN ANIMATION LOOP (60 FPS)
         * ==================================================================== */
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            STATE.time += delta;

            const fanSpeed = STATE.overclock ? 14 : 4;

            // Spin CPU Cooling Fans
            fanGroupArray.forEach(f => {
                f.rotation.x += delta * fanSpeed;
            });

            // Rotate Holographic Projection Above Monitor
            holoOrb.rotation.y += delta * 1.5;
            holoOrb.rotation.x += delta * 0.8;
            holoGroup.position.y = 4.3 + Math.sin(STATE.time * 2) * 0.08;

            // Float Cyber Particles
            const positions = particleGeom.attributes.position.array;
            for (let i = 1; i < particleCount * 3; i += 3) {
                positions[i] += delta * 0.3;
                if (positions[i] > 8) positions[i] = 0;
            }
            particleGeom.attributes.position.needsUpdate = true;

            // Wave RGB Ripple across Keyboard
            keyMeshes.forEach((k, idx) => {
                const wave = Math.sin(STATE.time * 4 + idx * 0.2);
                if (wave > 0.8) {
                    k.mesh.material.color.setHex(getActiveTheme().primary);
                } else {
                    k.mesh.material.color.setHex(0x222e44);
                }
            });

            // Update Dynamic 2D Monitor Canvas
            updateScreenCanvas(STATE.time);
            screenTexture.needsUpdate = true;

            // Raycast Check
            checkRaycast();

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Responsive Window Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
